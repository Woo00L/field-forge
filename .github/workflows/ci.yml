name: 代码检查

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Node.js ${{ matrix.node }} 测试与构建
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - name: 获取源码
        uses: actions/checkout@v7
      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: 安装锁定版本的依赖
        run: npm ci
      - name: 验证转换规则
        run: npm test
      - name: 构建离线网页
        run: npm run build
